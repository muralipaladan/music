<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced YouTube Music Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-wrapper {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-section input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            outline: none;
        }
        .input-section input::placeholder {
            color: #ccc;
        }
        .input-section button {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .input-section button:hover {
            background: #1ed760;
        }
        .album-art {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            background: #1e1e1e;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            overflow: hidden;
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }
        .album-art.playing {
            animation-play-state: running;
        }
        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .song-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
        }
        .artist-name {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin-bottom: 20px;
            text-align: center;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 20px;
        }
        .controls button {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .controls button:hover {
            color: #1db954; 
            transform: scale(1.1);
        }
        .play-btn {
            font-size: 3rem !important;
            color: #1db954 !important;
        }
        .playlist-container {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 10px;
        }
        .playlist-container::-webkit-scrollbar {
            width: 5px;
        }
        .playlist-container::-webkit-scrollbar-thumb {
            background: #1db954;
            border-radius: 5px;
        }
        .track-item {
            padding: 8px 12px;
            margin-bottom: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 0.9rem;
        }
        .track-item:hover, .track-item.active {
            background: rgba(29, 185, 84, 0.4);
        }
        #youtube-player {
            display: none; 
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="player-wrapper">
        <div class="input-section">
            <input type="text" id="playlist-input" placeholder="Playlist ID അല്ലെങ്കിൽ Link നൽകുക...">
            <button onclick="loadNewPlaylist()"><i class="fas fa-plus"></i> Add</button>
        </div>

        <div class="album-art" id="cover">
            <img src="https://via.placeholder.com/200/1e1e1e/1db954?text=Music" id="thumbnail" alt="Album Art">
        </div>
        
        <div class="song-title" id="title">പ്ലേലിസ്റ്റ് ലോഡ് ചെയ്യുന്നു...</div>
        <div class="artist-name" id="artist">YouTube Music</div>
        
        <div class="controls">
            <button onclick="prevTrack()" title="Previous"><i class="fas fa-step-backward"></i></button>
            <button class="play-btn" id="play-pause-btn" onclick="togglePlay()" title="Play/Pause"><i class="fas fa-play-circle"></i></button>
            <button onclick="nextTrack()" title="Next"><i class="fas fa-step-forward"></i></button>
        </div>

        <div class="playlist-container" id="track-list">
        </div>
    </div>

    <div id="youtube-player"></div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        var isPlaying = false;
        
        var savedPlaylist = localStorage.getItem('mySavedPlaylist');
        var currentPlaylistId = savedPlaylist ? savedPlaylist : 'UU8NeSRg0bBs_RnqVxL62B6w';

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '0',
                width: '0',
                playerVars: {
                    'listType': 'playlist',
                    'list': currentPlaylistId,
                    'autoplay': 0,
                    'controls': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('title').innerText = "പ്ലേ ചെയ്യാൻ തയ്യാറാണ്";
            generateTrackList();
            setupMediaSession();
        }

        function onPlayerStateChange(event) {
            var playPauseBtn = document.getElementById('play-pause-btn');
            var cover = document.getElementById('cover');
            
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause-circle"></i>';
                cover.classList.add('playing');
                updateVideoDetails();
                highlightCurrentTrack();
            } else if (event.data == YT.PlayerState.PAUSED || event.data == YT.PlayerState.ENDED) {
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play-circle"></i>';
                cover.classList.remove('playing');
            }
        }

        function togglePlay() {
            if (player && typeof player.getPlayerState === 'function') {
                if (isPlaying) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            }
        }

        function nextTrack() { if (player) player.nextVideo(); }
        function prevTrack() { if (player) player.previousVideo(); }

        function playSpecificTrack(index) {
            if (player) {
                player.playVideoAt(index);
            }
        }

        function loadNewPlaylist() {
            var inputVal = document.getElementById('playlist-input').value.trim();
            if(!inputVal) return;
            
            var playlistId = inputVal;
            if (inputVal.includes('list=')) {
                var urlParams = new URLSearchParams(inputVal.split('?')[1]);
                playlistId = urlParams.get('list');
            }

            if(playlistId) {
                currentPlaylistId = playlistId;
                localStorage.setItem('mySavedPlaylist', currentPlaylistId); 
                player.loadPlaylist({
                    'list': currentPlaylistId,
                    'listType': 'playlist',
                    'index': 0
                });
                setTimeout(generateTrackList, 2000); 
                document.getElementById('playlist-input').value = '';
            }
        }

        function generateTrackList() {
            var trackListContainer = document.getElementById('track-list');
            trackListContainer.innerHTML = '';
            
            if (player && player.getPlaylist) {
                var playlistArray = player.getPlaylist();
                if (playlistArray && playlistArray.length > 0) {
                    for (var i = 0; i < playlistArray.length; i++) {
                        var trackDiv = document.createElement('div');
                        trackDiv.className = 'track-item';
                        trackDiv.id = 'track-' + i;
                        trackDiv.innerText = '🎵 Track ' + (i + 1);
                        trackDiv.onclick = (function(index) {
                            return function() { playSpecificTrack(index); }
                        })(i);
                        trackListContainer.appendChild(trackDiv);
                    }
                }
            }
        }

        function highlightCurrentTrack() {
            if (player && player.getPlaylistIndex) {
                var currentIndex = player.getPlaylistIndex();
                var allTracks = document.getElementsByClassName('track-item');
                for(var i=0; i<allTracks.length; i++) {
                    allTracks[i].classList.remove('active');
                }
                var activeTrack = document.getElementById('track-' + currentIndex);
                if (activeTrack) {
                    activeTrack.classList.add('active');
                    activeTrack.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function updateVideoDetails() {
            if (player && player.getVideoData) {
                var data = player.getVideoData();
                if(data && data.video_id) {
                    var titleText = data.title;
                    var artistText = data.author;
                    var artUrl = 'https://img.youtube.com/vi/' + data.video_id + '/hqdefault.jpg';
                    
                    document.getElementById('title').innerText = titleText;
                    document.getElementById('artist').innerText = artistText;
                    document.getElementById('thumbnail').src = artUrl;

                    // Media Session API അപ്ഡേറ്റ് ചെയ്യുന്നു
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: titleText,
                            artist: artistText,
                            album: 'My Playlist',
                            artwork: [
                                { src: artUrl, sizes: '512x512', type: 'image/jpeg' }
                            ]
                        });
                    }
                }
            }
        }

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', function() { togglePlay(); });
                navigator.mediaSession.setActionHandler('pause', function() { togglePlay(); });
                navigator.mediaSession.setActionHandler('previoustrack', function() { prevTrack(); });
                navigator.mediaSession.setActionHandler('nexttrack', function() { nextTrack(); });
            }
        }

        function onPlayerError(event) {
            console.log("Error playing video. Moving to next.");
            nextTrack();
        }
    </script>
</body>
</html>
